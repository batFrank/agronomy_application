<VirtualHost *:80>
    ServerName localhost
    ServerAlias agronomy-app.local
    DocumentRoot "/var/www/html/public"

    <Directory "/var/www/html">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        #FallbackResource /index.php

        # Permitir cabeceras de autenticación
        SetEnvIf Authorization "^.+$" HTTP_AUTHORIZATION=$0
    </Directory>

    # Configure PHP-FPM as a proxy for PHP files
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://symfony-base-php:9000"
    </FilesMatch>
</VirtualHost>
