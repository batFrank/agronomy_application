<VirtualHost *:443>
    ServerName  localhost
    ServerAlias symfony-base.local
    DocumentRoot /var/www/html/public

    SSLEngine on
    SSLCertificateFile    /etc/ssl/private/apache-selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key

    <FilesMatch "\.(cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>

    <Directory /usr/lib/cgi-bin>
        SSLOptions +StdEnvVars
    </Directory>

    BrowserMatch "MSIE [2-6]" \
        nokeepalive ssl-unclean-shutdown \
        downgrade-1.0 force-response-1.0

    BrowserMatch "MSIE [17-9]" ssl-unclean-shutdown

    Alias /app /var/www/frontend

    <Directory "/var/www/frontend">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /app/index.html
    </Directory>

    # The component catalog is a static sibling site, not an SPA route. Without this,
    # a build whose client has BUILD_COMPONENT_CATALOG off leaves /app/storybook absent
    # and the fallback above silently serves the app shell, which then redirects to the
    # user's landing page instead of reporting that the catalog was never built.
    <Location "/app/storybook">
        FallbackResource disabled
    </Location>

    <Directory "/var/www/html">
            Options FollowSymLinks
            AllowOverride All
            Require all granted
            FallbackResource /index.php
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://symfony-base-php:9000"
    </FilesMatch>
</VirtualHost>
