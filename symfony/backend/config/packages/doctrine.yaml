doctrine:
    dbal:
        driver: '%env(resolve:DB_DRIVER)%'
        host: '%env(resolve:DB_HOST)%'
        port: '%env(int:DB_PORT)%'
        user: '%env(resolve:DB_USERNAME)%'
        password: '%env(resolve:DB_PASSWORD)%'
        dbname: '%env(resolve:DB_NAME)%'
        server_version: '%env(resolve:DB_VERSION)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true

# Keep this when@dev block: it registers "dev" as a known env so the
# auto-generated config/reference.php is identical no matter which env
# compiles the container (without it, running tests rewrites the file
# removing its when@dev sections).
when@dev:
    doctrine:
        dbal:
            profiling_collect_backtrace: true

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
